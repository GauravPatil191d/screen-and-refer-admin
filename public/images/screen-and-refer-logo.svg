<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="medicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Medical Shield Icon -->
  <g transform="translate(10, 10)">
    <!-- Background Shield -->
    <rect width="80" height="80" rx="22" fill="#0c192e" stroke="url(#medicalGrad)" stroke-width="2.5" />
    
    <!-- Pulse Circle Glow -->
    <circle cx="40" cy="40" r="28" fill="#0284c7" fill-opacity="0.12" />

    <!-- Medical Cross -->
    <rect x="35" y="22" width="10" height="36" rx="5" fill="url(#crossGrad)" />
    <rect x="22" y="35" width="36" height="10" rx="5" fill="url(#crossGrad)" />

    <!-- Stethoscope / Referral Node Link -->
    <path d="M26 40 L33 40 L37 32 L43 48 L47 40 L54 40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Active Pulse Dot -->
    <circle cx="54" cy="40" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(105, 38)">
    <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Screen<tspan fill="#38bdf8">&amp;</tspan>Refer
    </text>
    <text x="0" y="24" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2.8">
      CLINICAL DOCTOR PORTAL
    </text>
  </g>
</svg>
